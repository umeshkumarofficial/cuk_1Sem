<!--13: Iframe: Embed an external webpage or a YouTube video using iframe.-->

<!DOCTYPE html>
<html>
<head>
    <title>HTML Iframe</title>
</head>
<body>

    <h1>Iframe Example</h1>

    <h2>Embedding a Webpage</h2>
    <iframe src="https://www.wikipedia.org"
            width="400"
            height="200"
            title="Wikipedia Website">
    </iframe>

    <h2>Embedding a YouTube Video</h2>
    <iframe width="460"
            height="215"
            src="https://www.youtube.com/embed/VIDEO_ID"
            title="YouTube Video"
            allowfullscreen>
    </iframe>

</body>
</html>
