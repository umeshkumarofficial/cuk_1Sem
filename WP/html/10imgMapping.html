<!--Image Mapping: Create an image with clickable areas using the map and area tags.-->

<!DOCTYPE html>
<html>
<head>
    <title>Image Mapping</title>
</head>
<body>

    <h1>Image Mapping Example</h1>

    <img src="car.png" alt="Car Image" usemap="#carmap" width="400">

    <map name="carmap">
        <area shape="rect" coords="0,0,200,200"
              href="https://www.google.com"
              alt="Google">

        <area shape="rect" coords="201,0,400,200"
              href="https://www.wikipedia.org"
              alt="Wikipedia">
    </map>

</body>
</html>
