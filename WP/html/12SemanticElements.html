<!--12: Semantic Elements: Create a webpage using header, nav, main, section, and footer.-->

<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home Section</h2>
            <p>Welcome to my website.</p>
        </section>

        <section id="about">
            <h2>About Section</h2>
            <article>
                <h3>About HTML</h3>
                <p>HTML is used to create webpages.</p>
            </article>
        </section>

        <aside>
            <h3>Related Information</h3>
            <p>Learn more about web development.</p>
        </aside>
    </main>

    <footer>
        <p>Copyright &copy; 2026 My Website</p>
    </footer>

</body>
</html>
