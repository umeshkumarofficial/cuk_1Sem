<!--11: Description List: Create a glossary of 10 HTML terms using dl, dt, and dd.-->

<!DOCTYPE html>
<html>
<head>
    <title>Description List</title>
</head>
<body>

    <h1>HTML Terms and Definitions</h1>

    <dl>
        <dt>HTML</dt>
        <dd>HTML stands for HyperText Markup Language.</dd>

        <dt>CSS</dt>
        <dd>CSS stands for Cascading Style Sheets.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript is used to make webpages interactive.</dd>

        <dt>Web Browser</dt>
        <dd>A web browser is used to access websites.</dd>
    </dl>

</body>
</html>
