<!-- 18: Create a form with a textarea. -->

<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>
    <form>
        <label for="address">Address:</label><br>
        <textarea id="address" name="address"
                rows="4" cols="30"></textarea><br>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
