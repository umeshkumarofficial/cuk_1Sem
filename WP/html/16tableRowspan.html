<!-- 16. Create a table using rowspan and colspan. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Table using Rowspan & Colspan</title>
</head>
<body>
    <table border="1">
    <tr>
        <th colspan="2">Student Details</th>
    </tr>
    <tr>
        <td rowspan="2">MCA</td>
        <td>Semester 1</td>
    </tr>
    <tr>
        <td>Semester 2</td>
    </tr>
</table>
</body>
</html>
