<!--Hyperlinks: Create internal links to different sections of the same webpage.-->
<!DOCTYPE html>
<html>
<head>
    <title>Internal Hyperlinks</title>
</head>
<body>

    <h1>Internal Hyperlinks Example</h1>

    <a href="#about">Go to About Section</a>

    <br><br><br><br><br><br>

    <h2 id="about">About Section</h2>
    <p>This is the About section of the webpage.</p>

</body>
</html>
