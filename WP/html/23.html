<!-- 23: Create a webpage using the HTML5 input types. -->

<!DOCTYPE html>
<html>
<head>
    <title>Webpage using input types</title>
</head>
<body>
    <form>
        Date: <input type="date"><br>
        Age: <input type="number" min="18" max="60"><br>
        Color: <input type="color"><br>
        Range: <input type="range"><br>
        Email: <input type="email"><br>
        <input type="submit">
    </form>

</body>
</html>
