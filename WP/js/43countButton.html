
<!DOCTYPE html>
<html>
<head>
    <title>Count Button</title>
</head>
<body>

    <button onclick="countClick()">Click Me</button>

    <p id="result">Count: 0</p>

    <script>
        let count = 0;

        function countClick() {
            count++;
            document.getElementById("result").innerHTML =
                "Count: " + count;
        }
    </script>

</body>
</html>
