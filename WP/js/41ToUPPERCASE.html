
<!DOCTYPE html>
<html>
<head>
    <title>TO UPPERCASE</title>
</head>
<body>

    <input type="text" id="name" placeholder="Enter name">

    <button onclick="convert()">Convert</button>

    <p id="result"></p>

    <script>
        function convert() {
            let name = document.getElementById("name").value;
            document.getElementById("result").innerText =
                name.toUpperCase();
        }
    </script>

</body>
</html>
